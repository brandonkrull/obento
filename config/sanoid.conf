# ZFS snapshots. Thin, no reservations (lesson: a thick quota blocked snapshots in the article).
# Snapshots protect against deletion/ransomware/mistakes on the box. They are NOT off-site backup.

[tank/photos]
  use_template = family
[tank/vaultwarden]
  use_template = family
[tank/opencloud]
  use_template = family
[tank/backups]
  use_template = backups
[tank/media]
  use_template = media

[template_family]
  frequently = 0
  hourly = 24
  daily = 30
  monthly = 12
  yearly = 0
  autosnap = yes
  autoprune = yes

[template_backups]
  hourly = 0
  daily = 14
  monthly = 3
  autosnap = yes
  autoprune = yes

[template_media]
  hourly = 0
  daily = 7
  monthly = 1
  autosnap = yes
  autoprune = yes
