# Which address goes to which app. Traefik (compose service "traefik") reads this; the wildcard certificate
# for *.APPS_DOMAIN is set in docker-compose.yml. Names match on the first label, so photos.<APPS_DOMAIN>
# works for any domain. Apps are reached on the host's localhost ports (Traefik uses host networking).
http:
  routers:
    photos:
      rule: 'HostRegexp(`^photos\.`)'
      service: immich
    passwords:
      rule: 'HostRegexp(`^passwords\.`)'
      service: vaultwarden
    files:
      rule: 'HostRegexp(`^files\.`)'
      service: opencloud
    media:
      rule: 'HostRegexp(`^media\.`)'
      service: jellyfin
    adblock:
      rule: 'HostRegexp(`^adblock\.`)'
      service: adguard
    drives:
      rule: 'HostRegexp(`^drives\.`)'
      service: scrutiny
    portal:                             # APPS_DOMAIN itself, and any name not listed above
      rule: 'HostRegexp(`.+`)'
      priority: 1
      service: portal
  services:
    immich:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:2283
    vaultwarden:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8222
    opencloud:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:9201
    jellyfin:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8096
    adguard:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3000
    scrutiny:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8080
    portal:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3010
