# The portal at https://<APPS_DOMAIN> (Homepage, gethomepage.dev). install.sh copies these files to the server;
# edit them here, then 'obento update && obento restart portal'. Colors and fonts: custom.css.
# PORTAL_TITLE and PORTAL_LOGO in .env change the title and add a logo.
title: obento
theme: dark
color: slate
headerStyle: clean
hideVersion: true
# Keep layout last: install.sh appends the Downloads group's entry when those apps run.
layout:
  Family:
    style: row
    columns: 4
  Server:
    style: row
    columns: 4
