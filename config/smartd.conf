# Monitor every drive smartd can find.
#  -a            all standard checks (health, attributes, error + self-test logs)
#  -o on -S on   automatic offline testing + attribute autosave
#  -s (...)      short self-test daily at 02:00, long self-test on the 1st Saturday at 03:00
#  -W 4,45,50    alert on temp change >=4C, info at 45C, critical at 50C
#  -R 5 -C 197 -U 198  alert on ANY change in reallocated / pending / uncorrectable sectors
#  -M exec       send alerts through ntfy; -M test sends one at startup so you know it works
# Lesson from the Akita article: a drive logged errors for a month with no alert. Not here.
DEVICESCAN -a -o on -S on -n standby,q \
  -s (S/../.././02|L/../../6/03) \
  -W 4,45,50 -R 5! -C 197+ -U 198+ \
  -m root -M exec /usr/local/bin/homeserver-notify -M test
