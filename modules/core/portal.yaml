# Portal tiles for the core apps (the domain module shows them). href is the address people use, with @<key>@
# for the address name (see HOSTS in module.conf); siteMonitor is checked from the server for the status light.
- Family:
    - Photos:
        icon: immich.png
        href: https://@photos@.{{HOMEPAGE_VAR_DOMAIN}}
        description: Immich, photo and video backup
        siteMonitor: http://127.0.0.1:2283
    - Passwords:
        icon: vaultwarden.png
        href: https://@passwords@.{{HOMEPAGE_VAR_DOMAIN}}
        description: Vaultwarden, for the Bitwarden apps
        siteMonitor: http://127.0.0.1:8222
    - Media:
        icon: jellyfin.png
        href: https://@media@.{{HOMEPAGE_VAR_DOMAIN}}
        description: Jellyfin, movies, shows and music
        siteMonitor: http://127.0.0.1:8096
- Server:
    - Ad blocking:
        icon: adguard-home.png
        href: https://@adblock@.{{HOMEPAGE_VAR_DOMAIN}}
        description: AdGuard Home
        siteMonitor: http://127.0.0.1:3000
    - Drive health:
        icon: scrutiny.png
        href: https://@drives@.{{HOMEPAGE_VAR_DOMAIN}}
        description: Scrutiny
        siteMonitor: http://127.0.0.1:8080
    # Not shown as a tile: custom.js (domain module) draws it as the Drives gauge in the top row, from
    # scripts/pool-status.py (obento-pool-status.service). Hidden until the pool exists (RUNBOOK step 5).
    - Drives:
        widget:
          type: customapi
          url: http://127.0.0.1:3012/pool.json
          refreshInterval: 60000
          mappings:
            - field: free
              label: Free
              format: bytes
            - field: health
              label: Health
