# Always on: Immich, Vaultwarden, Jellyfin, AdGuard Home, Scrutiny (compose/docker-compose.yml).
DESCRIPTION="The family apps everyone gets"
# Addresses with the domain module: <name>.<APPS_DOMAIN> -> app on this localhost port (scripts/modules.sh).
HOSTS="photos:immich:2283 passwords:vaultwarden:8222 media:jellyfin:8096 adblock:adguard:3000 drives:scrutiny:8080"
# Without the domain module, Tailscale serve publishes these (https port:local port); Vaultwarden needs HTTPS.
SERVE="443:2283 8443:8222 8920:8096"
