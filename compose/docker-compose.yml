# Family server stack. Installed to /opt/homeserver/compose, where .env links to /etc/homeserver/.env.
# Manage it with 'tamago' (see 'tamago help'), not by running docker compose from the repo.
# Remote access is via Tailscale (no ports exposed to the internet). See docs/RUNBOOK.md.
name: homeserver

services:
  # ---------------------------------------------------------------- Immich (photos)
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
      TZ: ${TZ}
    devices:
      - /dev/dri:/dev/dri          # Intel Quick Sync for video transcoding
    ports:
      - "2283:2283"
    depends_on: [redis, database]
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # -openvino runs face/object recognition on the Intel iGPU instead of only the CPU
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    device_cgroup_rules:
      - "c 189:* rmw"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - immich-model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich_postgres
    # Check Immich's release notes for the current recommended tag before first start.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${IMMICH_DB_LOCATION}:/var/lib/postgresql/data   # stays on the NVMe SSD (fast)
    shm_size: 128mb
    restart: always

  # ---------------------------------------------------------------- Passwords
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest
    environment:
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}   # only "tamago signups on" sets this, until the next "tamago up"
      WEBSOCKET_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - ${VAULTWARDEN_DATA:-/srv/vaultwarden}:/data
    ports:
      - "8222:80"
    restart: always

  # ---------------------------------------------------------------- DNS ad/tracker blocking
  adguard:
    container_name: adguard
    image: adguard/adguardhome:latest
    volumes:
      - ${SSD_DATA}/adguard/work:/opt/adguardhome/work
      - ${SSD_DATA}/adguard/conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"            # first-run setup UI; then admin UI on the port you choose
    restart: always

  # ---------------------------------------------------------------- Media
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    devices:
      - /dev/dri:/dev/dri          # Quick Sync hardware transcoding
    volumes:
      - ${SSD_DATA}/jellyfin/config:/config
      - ${SSD_DATA}/jellyfin/cache:/cache
      - ${MEDIA_LOCATION:-/srv/media}:/media:ro
    ports:
      - "8096:8096"
    restart: always

  # ---------------------------------------------------------------- Files (Google Drive replacement)
  opencloud:
    container_name: opencloud
    image: opencloudeu/opencloud:4      # production (stable) line; 'tamago update' pulls 4.x fixes
    user: "1000:1000"                   # owns ${SSD_DATA}/opencloud and OPENCLOUD_DATA (install.sh)
    entrypoint: ["/bin/sh", "-c"]
    # init writes the config with random secrets on first start and fails harmlessly afterwards
    command: ["opencloud init || true; opencloud server"]
    # Host networking: OpenCloud checks sign-ins by fetching its own https://tamago.<tailnet>.ts.net:9200,
    # and Tailscale serve only answers connections from this machine or the tailnet, not from Docker's network.
    # install.sh writes OC_URL and the name -> Tailscale IP mapping into docker-compose.override.yml.
    network_mode: host
    environment:
      PROXY_HTTP_ADDR: "127.0.0.1:9201"   # only reachable through https://tamago.<tailnet>.ts.net:9200
      PROXY_TLS: "false"                # Tailscale serve terminates HTTPS
      OC_INSECURE: "false"
      IDM_ADMIN_PASSWORD: ${OPENCLOUD_ADMIN_PASSWORD:-}   # first start only; change it later in OpenCloud
      IDM_CREATE_DEMO_USERS: "false"
      OC_LOG_LEVEL: warn
      TZ: ${TZ}
    volumes:
      - ${SSD_DATA}/opencloud/config:/etc/opencloud
      - ${OPENCLOUD_DATA:-/srv/opencloud/data}:/var/lib/opencloud
    restart: always

  # ---------------------------------------------------------------- Drive health dashboard
  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add: [SYS_RAWIO, SYS_ADMIN]
    volumes:
      - /run/udev:/run/udev:ro
      - ${SSD_DATA}/scrutiny/config:/opt/scrutiny/config
      - ${SSD_DATA}/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      # Add one line per HDD after they're installed (scripts/print-scrutiny-devices.sh helps)
      - /dev/nvme0:/dev/nvme0
    ports:
      - "8080:8080"
    restart: always

volumes:
  immich-model-cache:
